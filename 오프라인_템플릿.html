<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무동향 브리핑 · {{DATE}}</title>
<style>
  :root{
    /* 노트(종이) 테마 — 저시력 사용자도 편하게 읽을 수 있도록 고대비 우선 */
    --bg: #f6f2e7;         /* 종이 바탕 */
    --bg-raised: #fffdf7;  /* 카드/입력요소용 밝은 종이 */
    --fg: #14100c;         /* 본문 검정 */
    --fg-dim: #4a453e;     /* 보조 텍스트 (충분한 대비 유지) */
    --rule: #d9d0ba;       /* 종이 괘선/구분선 */
    --accent: #35507a;     /* 표식용 (텍스트 색상에는 쓰지 않음) */
    --clear: #2f6b46;      /* 이상무 */
    --active: #94620a;     /* 확인 필요 */

    --font-display: 'Malgun Gothic', '맑은 고딕', Georgia, serif;
    --font-body: 'Malgun Gothic', '맑은 고딕', -apple-system, sans-serif;
    --font-mono: Consolas, 'Courier New', monospace;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  html{ -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body{
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; }

  .page{
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 22px 64px;
  }

  .kicker{
    display:flex; align-items:center; gap:10px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .kicker::before{
    content:"";
    width: 8px; height: 8px;
    background: var(--accent);
    display:inline-block;
  }
  h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 32px;
    line-height: 1.18;
    margin: 0 0 4px;
  }
  .sub{
    font-family: var(--font-body);
    font-size: 13.5px;
    color: var(--fg-dim);
    margin-bottom: 24px;
  }
  .meta{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg-dim);
    margin-bottom: 22px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }

  /* ---------- 오늘의 신호 요약 (시그니처) ---------- */
  .signal-row{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 26px;
  }
  .signal-chip{
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 12px;
    background: var(--bg-raised);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--fg-dim);
    flex: 1 1 140px;
  }
  .signal-chip .dot{
    width: 7px; height: 7px;
    border-radius: 50%;
    flex: none;
    background: var(--fg-dim);
  }
  .signal-chip.clear{ border-left-color: var(--clear); }
  .signal-chip.clear .dot{ background: var(--clear); }
  .signal-chip.active{ border-left-color: var(--active); }
  .signal-chip.active .dot{ background: var(--active); }
  .signal-chip .label{ color: var(--fg); }
  .signal-chip .status{ color: var(--fg-dim); margin-left: auto; white-space: nowrap; }

  /* ---------- 달력 ---------- */
  
  
  

  
  
  
  
  
  
  
  
  
  
  

  /* ---------- 본문 (노트 카드) ---------- */
  .content{
    position: relative;
    font-size: 13pt;
    line-height: 1.85;
    white-space: normal;
    color: var(--fg);
    background: var(--bg-raised);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 22px 20px 24px 30px;
    overflow-wrap: anywhere;
    overflow-x: hidden;
    min-width: 0;
  }
  /* 노트 느낌: 왼쪽 여백선 */
  .content::before{
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 18px;
    width: 1px;
    background: var(--rule);
  }
  .content p{
    margin: 0;
    /* 긴 URL 등이 박스를 벗어나지 않도록 강제 줄바꿈 */
    overflow-wrap: anywhere;
    word-break: break-word;
    min-width: 0;
  }

  /* 상위항목: 큰 분류 (📰 🏫 ⚖️ 📣) — 15pt, 굵게 */
  .content p.section-head{
    font-weight: 700;
    font-size: 15pt;
    color: var(--fg);
    margin-top: 28px;
    margin-bottom: 8px;
    padding-left: 10px;
    border-left: 4px solid var(--accent);
  }
  .content p.section-head:first-child{ margin-top: 0; }

  /* 중위항목: 개별 사례 (▶ ...) — 13pt, 굵게 */
  .content p.item-top{
    font-weight: 600;
    font-size: 13pt;
    color: var(--fg);
    margin-top: 14px;
  }

  /* 하위항목: 세부 내용 (  - ...) — 11pt, 보통 굵기, 들여쓰기 */
  .content p.item-sub{
    font-weight: 400;
    font-size: 11pt;
    color: var(--fg-dim);
    padding-left: 1.4em;
    margin-top: 2px;
  }

  .content p.item-top a,
  .content p.item-sub a,
  .content p a{
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .content p a:visited{ color: #6a4f8a; }
  .content .divider{ height: 0; margin: 18px 0; border-top: 1px solid var(--rule); }
  .content .footer-link{ background: var(--bg-raised); }

  .footer-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 32px;
    font-family: var(--font-mono);
    font-size: 12px;
    text-decoration: none;
    padding: 9px 14px;
    border: 1px solid var(--rule);
    color: var(--fg);
  }
  .footer-link:hover{ border-color: var(--accent); color: var(--accent); }

  .status{ font-family: var(--font-mono); font-size: 13px; padding: 14px 0; color: var(--fg-dim); }
  .status.error{ color: #a3271e; }

  
  @keyframes pulse{ 0%,100%{ opacity: 0.5; } 50%{ opacity: 1; } }
  @media (prefers-reduced-motion: reduce){ .skeleton{ animation: none; } }

  @media (max-width: 480px){
    .page{ padding: 30px 16px 48px; }
    h1{ font-size: 25px; }
    .signal-chip{ flex-basis: 100%; }
  }

  .page{ position: relative; }
  @media (max-width: 480px){
  }
</style>
</head>
<body>

<div class="page">
  <div class="kicker">업무동향 브리핑</div>
  <h1>유초등특수교육과 업무동향</h1>
  <div class="sub">뉴스 · 타시도 정책 · 법령동향 · 언론 모니터링</div>
  <div class="meta">{{DATE_KO}}</div>

  <div class="content" id="content">
<pre id="raw" style="display:none">{{BODY}}</pre>
  </div>
</div>

<script>
(function(){
  const SECTIONS = ["📰", "🏫", "⚖️", "📣"];

  function escapeHtml(str){
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
              .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  function linkifyHtml(escapedLine){
    return escapedLine.replace(/(https?:\/\/[^\s<]+)/g, function(url){
      const m = url.match(/[),.:;!?]+$/);
      const trailing = m ? m[0] : "";
      const clean = trailing ? url.slice(0, -trailing.length) : url;
      return '<a href="' + clean + '" target="_blank" rel="noopener noreferrer">' + clean + '</a>' + trailing;
    });
  }

  function renderPlainText(raw){
    return raw.replace(/\r\n/g, "\n").split("\n").map(function(line){
      const t = line.trim();
      if (t === "") return '<div class="blank"></div>';
      if (/^[━─=-]{5,}$/.test(t)) return '<div class="divider"></div>';
      if (SECTIONS.some(function(e){ return t.startsWith(e); }))
        return '<p class="section-head">' + escapeHtml(line) + '</p>';
      if (t.startsWith("▶"))
        return '<p class="item-top">' + linkifyHtml(escapeHtml(line)) + '</p>';
      const lead = line.length - line.trimStart().length;
      if (lead >= 2 && /^- ?/.test(t))
        return '<p class="item-sub">' + linkifyHtml(escapeHtml(t)) + '</p>';
      return '<p>' + linkifyHtml(escapeHtml(line)) + '</p>';
    }).join("");
  }

  // 본문은 이미 이 파일 안에 포함되어 있으므로 외부 통신이 전혀 없다.
  const raw = document.getElementById("raw").textContent;
  document.getElementById("content").innerHTML = renderPlainText(raw);
})();
</script>
</body>
</html>
